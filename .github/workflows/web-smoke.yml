name: Web scenario smoke

on:
  pull_request:
    paths:
      - "web/**"
      - "tests/web-smoke.spec.js"
      - "package.json"
      - ".github/workflows/web-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install browser test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static demo server
        shell: bash
        run: |
          python3 -m http.server 4173 -d web > /tmp/homeops-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/homeops-web.log
          exit 1

      - name: Run Chromium scenario parity tests
        run: npm run test:web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeops-web-smoke
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
