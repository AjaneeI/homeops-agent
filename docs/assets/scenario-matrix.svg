<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
<title id="title">HomeOps Agent scenario matrix</title>
<desc id="desc">Four deterministic Good Night Check scenarios demonstrate no-op success, low-risk automated fixes, human review for unknown lock status, and failure handling that leaves an unreachable device unchanged.</desc>
<rect width="720" height="900" rx="24" fill="#0E0D0C"/>
<text x="44" y="62" fill="#B66A45" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" letter-spacing="2">SCENARIO MATRIX</text>
<text x="44" y="108" fill="#F4E9DA" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="750">Four paths. One safety model.</text>
<text x="44" y="144" fill="#B1A598" font-family="Inter,system-ui,sans-serif" font-size="18">The same policy is exercised across success, action, uncertainty, and failure.</text>

<g font-family="Inter,system-ui,sans-serif">
  <g transform="translate(44 196)">
    <rect width="300" height="230" rx="20" fill="#181613" stroke="#71856A"/>
    <circle cx="34" cy="36" r="12" fill="#71856A"/>
    <text x="58" y="42" fill="#71856A" font-size="14" font-weight="700" letter-spacing="1">ALL CLEAR</text>
    <text x="24" y="90" fill="#F4E9DA" font-size="24" font-weight="700">Nothing to fix</text>
    <text x="24" y="126" fill="#B1A598" font-size="16">Devices already satisfy</text>
    <text x="24" y="150" fill="#B1A598" font-size="16">the Good Night policy.</text>
    <rect x="24" y="178" width="164" height="30" rx="15" fill="#263126"/>
    <text x="106" y="198" text-anchor="middle" fill="#E7ECD9" font-size="13" font-weight="700">NO ACTION NEEDED</text>
  </g>

  <g transform="translate(376 196)">
    <rect width="300" height="230" rx="20" fill="#181613" stroke="#71856A"/>
    <circle cx="34" cy="36" r="12" fill="#71856A"/>
    <text x="58" y="42" fill="#71856A" font-size="14" font-weight="700" letter-spacing="1">LOW-RISK FIX</text>
    <text x="24" y="90" fill="#F4E9DA" font-size="24" font-weight="700">Resolve quietly</text>
    <text x="24" y="126" fill="#B1A598" font-size="16">Dim the bedside bulb</text>
    <text x="24" y="150" fill="#B1A598" font-size="16">or turn off an outlet.</text>
    <rect x="24" y="178" width="170" height="30" rx="15" fill="#263126"/>
    <text x="109" y="198" text-anchor="middle" fill="#E7ECD9" font-size="13" font-weight="700">EXECUTE + LOG</text>
  </g>

  <g transform="translate(44 458)">
    <rect width="300" height="230" rx="20" fill="#181613" stroke="#B98A54"/>
    <circle cx="34" cy="36" r="12" fill="#B98A54"/>
    <text x="58" y="42" fill="#B98A54" font-size="14" font-weight="700" letter-spacing="1">LOCK UNKNOWN</text>
    <text x="24" y="90" fill="#F4E9DA" font-size="24" font-weight="700">Stop and ask</text>
    <text x="24" y="126" fill="#B1A598" font-size="16">Access-sensitive state is</text>
    <text x="24" y="150" fill="#B1A598" font-size="16">not changed automatically.</text>
    <rect x="24" y="178" width="188" height="30" rx="15" fill="#31281F"/>
    <text x="118" y="198" text-anchor="middle" fill="#F4E9DA" font-size="13" font-weight="700">HUMAN REVIEW</text>
  </g>

  <g transform="translate(376 458)">
    <rect width="300" height="230" rx="20" fill="#181613" stroke="#A66855"/>
    <circle cx="34" cy="36" r="12" fill="#A66855"/>
    <text x="58" y="42" fill="#A66855" font-size="14" font-weight="700" letter-spacing="1">DEVICE FAILURE</text>
    <text x="24" y="90" fill="#F4E9DA" font-size="24" font-weight="700">Fail closed</text>
    <text x="24" y="126" fill="#B1A598" font-size="16">Unavailable device stays</text>
    <text x="24" y="150" fill="#B1A598" font-size="16">unchanged and is reported.</text>
    <rect x="24" y="178" width="190" height="30" rx="15" fill="#30231F"/>
    <text x="119" y="198" text-anchor="middle" fill="#F4E9DA" font-size="13" font-weight="700">UNCHANGED + LOG</text>
  </g>

  <text x="44" y="758" fill="#82786F" font-size="14" font-weight="700" letter-spacing="1.4">VISIBLE IN THE DEMO</text>
  <rect x="44" y="780" width="632" height="76" rx="18" fill="#201D1A" stroke="#3C3732"/>
  <text x="360" y="812" text-anchor="middle" fill="#F4E9DA" font-size="18" font-weight="700">Device state · action result · approval request · tool trace</text>
  <text x="360" y="838" text-anchor="middle" fill="#B1A598" font-size="15">Every scenario leaves an inspectable trail.</text>
</g>
</svg>