  <text x="50" y="184" text-anchor="middle" fill="#71856A" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700">ACT</text>
  <text x="150" y="184" text-anchor="middle" fill="#B98A54" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700">ASK</text>
