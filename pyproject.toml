description = "Deterministic smart-home operations agent with low-risk automation, approval gates, and audit logging."
requires-python = ">=3.11"
dependencies = [
  "strands-agents>=1.55.1",
  "strands-agents-tools>=0.8.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
